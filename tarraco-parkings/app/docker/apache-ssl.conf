<VirtualHost *:80>
    ServerName tarraco.local
    ServerAlias localhost

    # Todo el tráfico va a HTTPS. El .htaccess repite la regla para el caso
    # de que la aplicación se sirva detrás de otro proxy.
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName tarraco.local
    ServerAlias localhost

    DocumentRoot /var/www/html/public

    SSLEngine on
    SSLCertificateFile    /etc/apache2/certs/tarraco.crt
    SSLCertificateKeyFile /etc/apache2/certs/tarraco.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # El código PHP de config/, src/ y templates/ no es accesible por HTTP:
    # solo se sirve lo que está en public/.
    <Directory /var/www/html/config>
        Require all denied
    </Directory>
    <Directory /var/www/html/src>
        Require all denied
    </Directory>
    <Directory /var/www/html/templates>
        Require all denied
    </Directory>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
