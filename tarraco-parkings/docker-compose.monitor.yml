name: tarraco-parkings-monitor

# Se levanta después del stack principal y se une a su red:
#   docker compose up -d
#   docker compose -f docker-compose.monitor.yml up -d

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tarraco-prometheus
    restart: unless-stopped
    volumes:
      - ./monitor/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks:
      - tarraco

  grafana:
    image: grafana/grafana:11.2.0
    container_name: tarraco-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tarraco.json
      TZ: ${APP_TIMEZONE:-Europe/Madrid}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitor/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitor/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - tarraco

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: tarraco-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - tarraco

  cadvisor:
    # v0.49.1 no arranca contra el Docker de esta VM: su cliente habla la API
    # 1.41, el daemon exige la 1.44 como mínimo y además no sabe leer el
    # almacén del containerd snapshotter. Sin contenedores, los paneles de CPU
    # y memoria salen vacíos. A partir de la v0.55 sí los detecta.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: tarraco-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # 8082 y no 8080: ese puerto lo ocupa phpMyAdmin en el stack principal.
    ports:
      - "8082:8080"
    networks:
      - tarraco

volumes:
  prom_data:
    name: tarraco-prometheus-data
  grafana_data:
    name: tarraco-grafana-data

networks:
  tarraco:
    external: true
    name: tarraco-parkings_tarraco
